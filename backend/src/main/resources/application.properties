# Spring Boot application properties

# ── Server ───────────────────────────────────────────────────────
server.port=8080

# ── Database Configuration (Auto-Switching) ───────────────────────
# By default, this uses the local H2 in-memory database.
# When deployed to Render, you will set environment variables 
# (SPRING_DATASOURCE_URL, etc.) to connect to your free Neon/Supabase PostgreSQL database.

spring.config.import=optional:file:.env.properties

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:networkingdb;DB_CLOSE_DELAY=-1}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
# ── File Upload (allow PDFs up to 20 MB) ─────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=22MB

# ── Gemini AI Integration ─────────────────────────────────────────
# Obtain your key from https://aistudio.google.com/
google.gemini.api.key=${GOOGLE_GEMINI_API_KEY:REPLACE_WITH_YOUR_KEY}
google.gemini.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent
